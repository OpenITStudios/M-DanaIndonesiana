name: Governance and Synthetic Verify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dana-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Structural repository checks
        run: node tools/verify-repository.mjs
      - name: Offline synthetic regression tests
        run: node --test tests/*.test.mjs
